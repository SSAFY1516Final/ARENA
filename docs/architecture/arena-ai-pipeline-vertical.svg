<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 50px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .subtitle { font: 500 24px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4b5563; }
      .step-title { font: 800 40px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .step-sub { font: 600 23px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4b5563; }
      .number { font: 800 30px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #111827; stroke-width: 5; }
      .line { stroke: #111827; stroke-width: 5; marker-end: url(#arrow); }
      .icon-line { stroke: #111827; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#ffffff"/>

  <text x="540" y="92" text-anchor="middle" class="title">AI 사용 파이프라인</text>
  <text x="540" y="136" text-anchor="middle" class="subtitle">ARENA가 주제를 토론으로 바꾸는 과정</text>

  <!-- Step 1 -->
  <g transform="translate(145 200)">
    <rect width="790" height="200" rx="32" class="card"/>
    <circle cx="84" cy="100" r="38" fill="#2563eb"/>
    <text x="84" y="111" text-anchor="middle" class="number">1</text>
    <path d="M190 65h74M190 100h124M190 135h90" class="icon-line" fill="none"/>
    <text x="370" y="91" class="step-title">원본 주제 입력</text>
    <text x="370" y="133" class="step-sub">사용자가 토론하고 싶은 주제를 입력</text>
  </g>
  <path d="M540 420 V485" class="line"/>

  <!-- Step 2 -->
  <g transform="translate(145 505)">
    <rect width="790" height="200" rx="32" class="card"/>
    <circle cx="84" cy="100" r="38" fill="#2563eb"/>
    <text x="84" y="111" text-anchor="middle" class="number">2</text>
    <path d="M220 55c-22 0-40 16-40 36 0 2 0 4 1 6-15 3-27 15-27 30 0 17 15 31 34 31h64c21 0 38-15 38-34 0-16-12-29-29-33-2-20-19-36-41-36z" class="icon-line" fill="none"/>
    <text x="370" y="82" class="step-title">주제 프레이밍</text>
    <text x="370" y="123" class="step-sub">토론 가능한 축과 기본 조건을 정리</text>
    <text x="370" y="156" class="step-sub">찬반 관점을 생성할 기준 마련</text>
  </g>
  <path d="M540 725 V790" class="line"/>

  <!-- Step 3 -->
  <g transform="translate(145 810)">
    <rect width="790" height="200" rx="32" class="card"/>
    <circle cx="84" cy="100" r="38" fill="#2563eb"/>
    <text x="84" y="111" text-anchor="middle" class="number">3</text>
    <path d="M190 66h86M190 102h118M190 138h98M316 78l26 26-26 26" class="icon-line" fill="none"/>
    <text x="370" y="91" class="step-title">후보 생성</text>
    <text x="370" y="133" class="step-sub">AI가 토론용 세부 후보를 생성</text>
  </g>
  <path d="M540 1030 V1095" class="line"/>

  <!-- Step 4 -->
  <g transform="translate(145 1115)">
    <rect width="790" height="200" rx="32" class="card"/>
    <circle cx="84" cy="100" r="38" fill="#2563eb"/>
    <text x="84" y="111" text-anchor="middle" class="number">4</text>
    <path d="M190 70h86M190 106h112M190 142h76M304 145l25 25 52-66" class="icon-line" fill="none"/>
    <text x="370" y="82" class="step-title">후보 검증 / 선택</text>
    <text x="370" y="123" class="step-sub">AI가 후보 품질을 검증</text>
    <text x="370" y="156" class="step-sub">사용자가 진행할 후보를 선택</text>
  </g>
  <path d="M540 1335 V1400" class="line"/>

  <!-- Step 5 -->
  <g transform="translate(145 1420)">
    <rect width="790" height="200" rx="32" class="card"/>
    <circle cx="84" cy="100" r="38" fill="#2563eb"/>
    <text x="84" y="111" text-anchor="middle" class="number">5</text>
    <path d="M178 72h120M178 118h78M314 80c26 0 47 19 47 42s-21 42-47 42h-30l-34 31v-31" class="icon-line" fill="none"/>
    <text x="370" y="82" class="step-title">토론 구성</text>
    <text x="370" y="123" class="step-sub">선택된 후보로 양측 입장과 논점 구성</text>
    <text x="370" y="156" class="step-sub">토론 흐름을 AI가 생성</text>
  </g>
  <path d="M540 1640 V1705" class="line"/>

  <!-- Step 6 -->
  <g transform="translate(145 1725)">
    <rect width="790" height="160" rx="32" class="card"/>
    <circle cx="84" cy="80" r="38" fill="#2563eb"/>
    <text x="84" y="91" text-anchor="middle" class="number">6</text>
    <path d="M190 55h92M190 91h136M190 127h88" class="icon-line" fill="none"/>
    <text x="370" y="72" class="step-title">요약 생성</text>
    <text x="370" y="114" class="step-sub">핵심 주장과 판단 기준을 요약</text>
  </g>
</svg>
