<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 800 42px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .subtitle { font: 500 19px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4b5563; }
      .box-title { font: 800 25px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .box-sub { font: 700 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4b5563; }
      .module { font: 800 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .flow-label { font: 800 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .card { fill: #ffffff; stroke: #111827; stroke-width: 4; }
      .module-card { fill: #f9fafb; stroke: #111827; stroke-width: 2.5; }
      .line { stroke: #111827; stroke-width: 3.2; marker-end: url(#arrow); }
      .line-both { stroke: #111827; stroke-width: 3.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .icon-line { stroke: #111827; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="62" text-anchor="middle" class="title">ARENA 아키텍처 - AI 토론 서비스 흐름</text>
  <text x="800" y="98" text-anchor="middle" class="subtitle">Vue Client · Spring Boot API · GMS AI API · MySQL · Kakao OAuth</text>

  <!-- User -->
  <g transform="translate(54 310)">
    <circle cx="62" cy="30" r="23" class="icon-line" fill="none"/>
    <path d="M24 105c7-32 70-32 77 0" class="icon-line" fill="none"/>
    <rect x="108" y="15" width="43" height="31" rx="6" class="icon-line" fill="none"/>
    <path d="M118 27h23M118 37h14" class="icon-line" stroke-width="3" fill="none"/>
    <text x="78" y="157" text-anchor="middle" class="box-title">사용자</text>
  </g>

  <!-- Vue Client -->
  <g transform="translate(220 215)">
    <rect width="260" height="360" rx="26" class="card"/>
    <image href="icons/vuedotjs.svg" x="68" y="36" width="56" height="56"/>
    <image href="icons/vite.svg" x="137" y="36" width="56" height="56"/>
    <text x="130" y="126" text-anchor="middle" class="box-title">Vue Client</text>
    <text x="130" y="153" text-anchor="middle" class="box-sub">Vue 3 + Vite</text>
    <g transform="translate(28 188)">
      <rect width="92" height="42" rx="12" class="module-card"/>
      <text x="46" y="27" text-anchor="middle" class="module">주제 입력</text>
    </g>
    <g transform="translate(140 188)">
      <rect width="92" height="42" rx="12" class="module-card"/>
      <text x="46" y="27" text-anchor="middle" class="module">후보 선택</text>
    </g>
    <g transform="translate(28 250)">
      <rect width="92" height="42" rx="12" class="module-card"/>
      <text x="46" y="27" text-anchor="middle" class="module">토론방</text>
    </g>
    <g transform="translate(140 250)">
      <rect width="92" height="42" rx="12" class="module-card"/>
      <text x="46" y="27" text-anchor="middle" class="module">결과</text>
    </g>
  </g>

  <!-- Spring Boot API -->
  <g transform="translate(600 185)">
    <rect width="390" height="420" rx="30" class="card"/>
    <image href="icons/springboot.svg" x="116" y="38" width="60" height="60"/>
    <image href="icons/springsecurity.svg" x="214" y="38" width="60" height="60"/>
    <text x="195" y="132" text-anchor="middle" class="box-title">Spring Boot API</text>
    <text x="195" y="160" text-anchor="middle" class="box-sub">Java 17 · Spring Boot 3</text>
    <g transform="translate(36 198)">
      <rect width="138" height="52" rx="14" class="module-card"/>
      <text x="69" y="33" text-anchor="middle" class="module">Auth / JWT</text>
    </g>
    <g transform="translate(216 198)">
      <rect width="138" height="52" rx="14" class="module-card"/>
      <text x="69" y="33" text-anchor="middle" class="module">Debate API</text>
    </g>
    <g transform="translate(36 278)">
      <rect width="138" height="52" rx="14" class="module-card"/>
      <text x="69" y="33" text-anchor="middle" class="module">AI Pipeline</text>
    </g>
    <g transform="translate(216 278)">
      <rect width="138" height="52" rx="14" class="module-card"/>
      <text x="69" y="33" text-anchor="middle" class="module">Post API</text>
    </g>
    <g transform="translate(126 350)">
      <rect width="138" height="44" rx="14" class="module-card"/>
      <text x="69" y="28" text-anchor="middle" class="module">MyBatis</text>
    </g>
  </g>

  <!-- GMS AI -->
  <g transform="translate(1130 185)">
    <rect width="300" height="235" rx="26" class="card"/>
    <path d="M150 29c-23 0-42 17-42 38 0 2 0 4 1 6-16 3-27 16-27 31 0 18 16 32 35 32h68c22 0 39-16 39-35 0-17-13-30-30-34-2-21-20-38-44-38z" stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="31" font-weight="800" fill="#111827">AI</text>
    <text x="150" y="154" text-anchor="middle" class="box-title">GMS AI API</text>
    <text x="150" y="181" text-anchor="middle" class="box-sub">프레이밍 · 후보 · 토론 · 요약</text>
  </g>

  <!-- MySQL -->
  <g transform="translate(1130 510)">
    <rect width="300" height="230" rx="26" class="card"/>
    <image href="icons/mysql.svg" x="122" y="28" width="56" height="56"/>
    <text x="150" y="112" text-anchor="middle" class="box-title">MySQL</text>
    <text x="150" y="143" text-anchor="middle" class="box-sub">사용자 · 토론 · 발화</text>
    <text x="150" y="171" text-anchor="middle" class="box-sub">요약 · 게시글 · AI 로그</text>
  </g>

  <!-- Kakao -->
  <g transform="translate(610 675)">
    <rect width="280" height="145" rx="24" class="card"/>
    <image href="icons/kakao.svg" x="112" y="26" width="56" height="56"/>
    <text x="140" y="112" text-anchor="middle" class="box-title">Kakao OAuth</text>
  </g>

  <!-- Result page -->
  <g transform="translate(235 660)">
    <rect width="230" height="145" rx="24" class="card"/>
    <rect x="58" y="27" width="114" height="74" rx="8" stroke="#111827" stroke-width="5" fill="none"/>
    <path d="M58 50h114M79 73h34M79 91h66" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <circle cx="73" cy="39" r="4" fill="#111827"/>
    <circle cx="89" cy="39" r="4" fill="#111827"/>
    <circle cx="105" cy="39" r="4" fill="#111827"/>
    <text x="115" y="124" text-anchor="middle" class="box-title">결과 페이지</text>
  </g>

  <!-- Arrows -->
  <path d="M185 375 H210" class="line"/>
  <text x="192" y="353" text-anchor="middle" class="flow-label">입력</text>

  <path d="M480 355 H590" class="line"/>
  <text x="535" y="334" text-anchor="middle" class="flow-label">REST 요청</text>

  <path d="M600 430 H490" class="line"/>
  <text x="545" y="458" text-anchor="middle" class="flow-label">응답 데이터</text>

  <path d="M990 300 H1120" class="line-both"/>
  <text x="1055" y="278" text-anchor="middle" class="flow-label">AI 요청 / 응답</text>

  <path d="M990 515 H1120" class="line-both"/>
  <text x="1055" y="493" text-anchor="middle" class="flow-label">저장 / 조회</text>

  <path d="M750 605 V665" class="line-both"/>
  <text x="795" y="642" text-anchor="middle" class="flow-label">로그인</text>

  <path d="M350 575 V650" class="line"/>
  <text x="412" y="622" text-anchor="middle" class="flow-label">렌더링</text>
</svg>
