services:
  mysql:
    image: mysql:8.4
    container_name: arena-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: arena
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-arena-root-password}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - arena-mysql-data:/var/lib/mysql
      - ./server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./server
    container_name: arena-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/arena?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-arena-root-password}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set JWT_SECRET.}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:5173/auth/kakao/callback}
      GMS_KEY: ${GMS_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com}
      GMS_COMPLETIONS_PATH: ${GMS_COMPLETIONS_PATH:-/v1/chat/completions}
      GMS_MODEL: ${GMS_MODEL:-gpt-5.4-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:15173,http://127.0.0.1:15173}
    ports:
      - "${APP_PORT:-8080}:8080"

  client:
    build: ./client
    container_name: arena-client
    restart: unless-stopped
    depends_on:
      - app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
      VITE_KAKAO_REST_API_KEY: ${VITE_KAKAO_REST_API_KEY:-${KAKAO_REST_API_KEY:-}}
      VITE_KAKAO_REDIRECT_URI: ${VITE_KAKAO_REDIRECT_URI:-http://localhost:15173/auth/kakao/callback}
    ports:
      - "${CLIENT_PORT:-15173}:15173"
    volumes:
      - ./client:/app
      - arena-client-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 15173

volumes:
  arena-mysql-data:
  arena-client-node-modules:
